server {
    listen 80;
    client_max_body_size 55M;

    # Proxy /api/* to the API container, stripping the /api prefix
    location /api/ {
        proxy_pass         http://api:5184/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Hashed assets can be cached aggressively
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|ico)$ {
        root       /usr/share/nginx/html;
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all other paths serve index.html
    location / {
        root       /usr/share/nginx/html;
        try_files  $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
